<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback View - PetAid</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="navbar-container"></div>

    <main class="main-content">
        <h1 class="page-title">Feedback View</h1>
        <p class="page-subtitle">View all user feedback submissions.</p>

        <section id="analytics" class="panel-block">
            <h2>Rating distributions (per-section, 1–10)</h2>
            <div id="rating-colors-legend" class="rating-legend" aria-hidden="false"></div>

            <div class="analytics-grid">
                <div class="analytics-card">
                    <div class="analytics-header">Forum</div>
                    <canvas id="pie_forum" width="260" height="160"></canvas>
                    <canvas id="bar_forum" width="260" height="80" style="margin-top:6px"></canvas>
                </div>
                <div class="analytics-card">
                    <div class="analytics-header">Quiz</div>
                    <canvas id="pie_quiz" width="260" height="160"></canvas>
                    <canvas id="bar_quiz" width="260" height="80" style="margin-top:6px"></canvas>
                </div>
                <div class="analytics-card">
                    <div class="analytics-header">First Aid Guide</div>
                    <canvas id="pie_firstAid" width="260" height="160"></canvas>
                    <canvas id="bar_firstAid" width="260" height="80" style="margin-top:6px"></canvas>
                </div>
                <div class="analytics-card">
                    <div class="analytics-header">Login Page</div>
                    <canvas id="pie_login" width="260" height="160"></canvas>
                    <canvas id="bar_login" width="260" height="80" style="margin-top:6px"></canvas>
                </div>
                <div class="analytics-card">
                    <div class="analytics-header">Map</div>
                    <canvas id="pie_map" width="260" height="160"></canvas>
                    <canvas id="bar_map" width="260" height="80" style="margin-top:6px"></canvas>
                </div>
            </div>
        </section>
        <!-- Average rating per section removed; per-section horizontal bars provide same info -->

        <section id="raw-data" style="margin-top:18px;">
            <div class="panel-block">
                <h3>Raw submissions</h3>
                <div id="feedbackList" class="feedback-list"></div>
            </div>
        </section>

    </main>
    <div id="footer-container"></div>

    <script src="classes/User.js"></script>
    <script src="classes/PetOwner.js"></script>
    <script src="classes/Veterinarian.js"></script>
    <script src="classes/Admin.js"></script>
    <script src="utils/StorageHelper.js"></script>
    <script src="utils/SessionHelper.js"></script>
    <script src="classes/Feedback.js"></script>
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="feedback-view.js"></script>

</body>
</html>
