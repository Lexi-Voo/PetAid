<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PetAid</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar">
        <a href="#" class="navbar-brand">🐾 PetAid</a>
        <div>
            <a href="register.html" style="text-decoration: none; color: #3498db; font-weight: bold;">Register</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p style="color: #7f8c8d; margin-bottom: 30px;">Sign in to your account.</p>
            
            <div id="statusMessage" class="status-msg"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" 
                        style="display: block; width: max-content; padding: 12px 24px; background-color: #3498db; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;"
                        onmouseover="this.style.backgroundColor='#2980b9'" 
                        onmouseout="this.style.backgroundColor='#3498db'">
                    Login
                </button>
            </form>

            <p class="auth-footer">Don't have an account? <a href="register.html">Create one</a></p>
        </div>
    </main>

    <script src="classes/UserProfile.js"></script>
    <script src="classes/User.js"></script>
    <script src="classes/PetOwner.js"></script>
    <script src="classes/Veterinarian.js"></script>
    <script src="classes/Admin.js"></script>

    <script src="utils/StorageHelper.js"></script>
    <script src="utils/SessionHelper.js"></script>
    <script src="utils/Confirmation.js"></script>

    <script src="login.js"></script>
</body>
</html>
