<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide - PetAid</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Guide Header -->
        <div class="guide-header">
            
            <h1 class="guide-detail-title" id="guideTitle">Loading...</h1>
            <p class="guide-detail-category" id="guideCategory"></p>

            <!-- Admin: Edit guide title/category, Delete entire guide -->
            <div class="guide-detail-actions admin-only">
                <button class="btn btn-outline btn-sm" onclick="openEditGuideModal()">
                    Edit Guide
                </button>
                <button class="btn btn-danger btn-sm" onclick="openDeleteGuideModal()">
                    Delete Guide
                </button>
            </div>
        </div>

        <!-- Steps Section -->
        <section class="steps-section">
            <div class="steps-section-header">
                <h2 class="section-title">Steps</h2>
                <button class="btn btn-primary btn-sm admin-only" onclick="openAddStepModal()">
                    + Add Step
                </button>
            </div>
            <div id="stepsList">
                <!-- Steps rendered by JS -->
            </div>
        </section>

        <!-- Videos Section -->
        <section class="videos-section">
            <div class="videos-section-header">
                <h2 class="section-title">Videos</h2>
                <button class="btn btn-primary btn-sm admin-only" onclick="openAddVideoModal()">
                    + Add Video
                </button>
            </div>
            <div id="videosList">
                <!-- Videos rendered by JS -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Edit Guide Modal -->
    <div class="modal-overlay" id="editGuideModal">
        <div class="modal">
            <h3 class="modal-title">Edit Guide</h3>
            <div class="form-group">
                <label for="editGuideTitle">Guide Title</label>
                <input type="text" id="editGuideTitle">
            </div>
            <div class="form-group">
                <label for="editGuideCategory">Category</label>
                <select id="editGuideCategory">
                    <option value="dog">Dog</option>
                    <option value="cat">Cat</option>
                    <option value="rabbit">Rabbit</option>
                    <option value="hamster">Hamster</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeEditGuideModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveEditGuide()">Save</button>
            </div>
        </div>
    </div>

    <!-- Add/Edit Step Modal -->
    <div class="modal-overlay" id="stepModal">
        <div class="modal">
            <h3 class="modal-title" id="stepModalTitle">Add Step</h3>
            <div class="form-group">
                <label for="stepInstruction">Instruction</label>
                <textarea id="stepInstruction" placeholder="Describe the step clearly..."></textarea>
            </div>
            <div class="form-group">
                <label for="stepImageURL">Image URL (optional)</label>
                <input type="text" id="stepImageURL" placeholder="assets/images/guides/example.png">
            </div>
            <input type="hidden" id="editingStepNumber">
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeStepModal()">Cancel</button>
                <button class="btn btn-primary" id="stepModalSave" onclick="saveStep()">Add</button>
            </div>
        </div>
    </div>

    <!-- Add Video Modal -->
    <div class="modal-overlay" id="videoModal">
        <div class="modal">
            <h3 class="modal-title" id="videoModalTitle">Add Video</h3>
            <div class="form-group">
                <label for="videoTitle">Video Title</label>
                <input type="text" id="videoTitle" placeholder="e.g. How to Handle Choking">
            </div>
            <div class="form-group">
                <label for="videoURL">Video URL</label>
                <input type="text" id="videoURL" placeholder="https://youtube.com/...">
            </div>
            <input type="hidden" id="editingVideoTitle">
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeVideoModal()">Cancel</button>
                <button class="btn btn-primary" id="videoModalSave" onclick="saveVideo()">Add</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="classes/Step.js"></script>
    <script src="classes/Video.js"></script>
    <script src="classes/FirstAidGuide.js"></script>
    <script src="components/Navbar.js"></script>
    <script src="components/Footer.js"></script>
    <script src="classes/User.js"></script>
    <script src="classes/Admin.js"></script>
    <script src="utils/StorageHelper.js"></script>
    <script src="utils/Confirmation.js"></script>
    <script src="utils/DeleteConfirm.js"></script>
    <script src="guideView.js"></script>

</body>
</html>
