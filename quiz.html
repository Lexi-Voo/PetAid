<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Aid Guide - PetAid</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="main-content">
        <h1 class="page-title">Quiz</h1>
        <p class="page-subtitle">Choose any category to start your quiz session</p>

        <!-- Category Cards -->
        <div class="category-grid">
            <div class="category-card" data-category="dog" onclick="selectCategory('dog')">
                <img src="assets/images/dog.svg" alt="Dog">
                <span class="category-card-label">Dog</span>
            </div>
            <div class="category-card" data-category="cat" onclick="selectCategory('cat')">
                <img src="assets/images/cat.svg" alt="Cat">
                <span class="category-card-label">Cat</span>
            </div>
            <div class="category-card" data-category="rabbit" onclick="selectCategory('rabbit')">
                <img src="assets/images/rabbit.svg" alt="Rabbit">
                <span class="category-card-label">Rabbit</span>
            </div>
            <div class="category-card" data-category="hamster" onclick="selectCategory('hamster')">
                <img src="assets/images/hamster.svg" alt="Hamster">
                <span class="category-card-label">Hamster</span>
            </div>
        </div>

        <!-- Quiz List (appears below cards when category is selected) -->
        <section class="quiz-list-section" id="quizListSection">
            <div class="quiz-list-header">
                <h2 class="quiz-list-title" id="quizListTitle"></h2>
                <button class="btn btn-primary btn-sm admin-only" onclick="openCreateQuizModal()">
                    + Create Quiz
                </button>
            </div>
            <div class="quiz-list" id="quizList">
                <!-- Quiz items rendered by JS -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Create Quiz Modal -->
    <div class="modal-overlay" id="quizModal">
        <div class="modal">
            <h3 class="modal-title" id="quizModalTitle">Create New Quiz</h3>
            <div class="form-group">
                <label for="quizTitle">Quiz Title</label>
                <input type="text" id="quizTitle" placeholder="e.g. Choking">
            </div>
            <div class="form-group">
                <label for="quizCategory">Category</label>
                <select id="quizCategory">
                    <option value="dog">Dog</option>
                    <option value="cat">Cat</option>
                    <option value="rabbit">Rabbit</option>
                    <option value="hamster">Hamster</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeQuizModal()">Cancel</button>
                <button class="btn btn-primary" id="quizModalSave" onclick="saveQuiz()">Create</button>
            </div>
        </div>
    </div>

    

    <!-- Scripts (order matters) -->
    
    <script src="classes/QuizQuestion.js"></script>
    <script src="classes/Quiz.js"></script>
    <script src="utils/SessionHelper.js"></script>
    <script src="components/Navbar.js"></script>
    <script src="components/Footer.js"></script>
    <script src="classes/User.js"></script>
    <script src="classes/Admin.js"></script>
    <script src="utils/StorageHelper.js"></script>
    <script src="utils/Confirmation.js"></script>
    <script src="quiz.js"></script>

</body>
</html>
