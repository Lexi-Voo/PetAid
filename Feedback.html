<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - PetAid</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="navbar-container"></div>
    <main class="main-content">
        <h1 class="page-title">Feedback</h1>
        <p class="page-subtitle">We'd love to hear your thoughts!</p>

        <form id="feedbackForm" class="feedback-form">
            <div class="form-group rating-row">
                <div class="rating-label">Forum</div>
                <div class="rating-bubbles" data-field="forum" role="radiogroup" required="" aria-label="Forum rating"></div>
            </div>
            <div class="form-group rating-row">
                <div class="rating-label">Quiz</div>
                <div class="rating-bubbles" data-field="quiz" role="radiogroup" aria-label="Quiz rating"></div>
            </div>
            <div class="form-group rating-row">
                <div class="rating-label">First Aid Guide</div>
                <div class="rating-bubbles" data-field="firstaid" role="radiogroup" required="" aria-label="First Aid rating"></div>
            </div>
            <div class="form-group rating-row">
                <div class="rating-label">Login Page</div>
                <div class="rating-bubbles" data-field="login" role="radiogroup" required="" aria-label="Login rating"></div>
            </div>
            <div class="form-group rating-row">
                <div class="rating-label">Map</div>
                <div class="rating-bubbles" data-field="map" role="radiogroup" required="" aria-label="Map rating"></div>
            </div>

            <div class="form-group">
                <label for="comments">Anything else you'd like to tell us?</label>
                <textarea id="comments" style="border-color:black" name="comments" placeholder="Write your thoughts here..."></textarea>
            </div>

            <div class="feedback-actions">
                <button type="submit" class="btn btn-primary">Submit Feedback</button>
                <span class="feedback-result" id="feedbackResult" aria-live="polite"></span>
            </div>
        </form>
    </main>
    <div id="footer-container"></div>

    <script src="classes/UserProfile.js"></script>
    <script src="classes/User.js"></script>
    <script src="classes/PetOwner.js"></script>
    <script src="classes/Veterinarian.js"></script>
    <script src="classes/Admin.js"></script>
    <script src="utils/StorageHelper.js"></script>
    <script src="utils/SessionHelper.js"></script>
    <script src="classes/Feedback.js"></script>
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="feedback-form.js"></script>
</body>
</html>
