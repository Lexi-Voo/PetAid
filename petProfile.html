<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Profile - PetAid</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar">
        <a href="firstAid.html" class="navbar-brand">🐾 PetAid</a>
        <ul class="navbar-links">
            <li><a href="#">Clinics</a></li>
            <li><a href="firstAid.html">First Aid</a></li>
            <li><a href="#">Forum</a></li>
            <li><a href="#">Quizzes</a></li>
        </ul>
        <div class="navbar-auth"></div>
    </nav>

    <div style="max-width: 850px; margin: 30px 0 0 0; padding: 0 200px;">
        <a href="profile.html" class="btn-back"> < Back to My Profile</a>
    </div>

    <main class="profile-container">
        <aside class="pet-info-card">
            <input type="file" id="petImgUploader" accept="image/*" style="display: none;">
            <div class="avatar-wrapper" id="avatarUploadTrigger">
                <img id="displayPetImg" src="" alt="Pet Picture" class="pet-avatar">
            </div>
            <div>
                <button type="button" id="changePhotoBtn" class="btn-photo">Change Photo</button>
            </div>
            <h1 id="displayPetName" class="pet-name">Loading...</h1>
            <span id="displayPetCategory" class="pet-tag">...</span>
            <p id="displayPetBio" style="font-style: italic; color: #7f8c8d; margin-top: 15px; font-size: 14px;"></p>
            <div id="photoStatusMessage" class="status-msg" style="margin-top:10px;">Photo Updated!</div>
        </aside>

        <section class="panel-block">
            <h2>Edit Pet Information</h2>
            <form id="editPetForm">
                <div class="form-group">
                    <label for="editPetName">Pet Name</label>
                    <input type="text" id="editPetName" required disabled>
                </div>
                
                <div class="form-group">
                    <label for="editPetCategory">Category</label>
                    <select id="editPetCategory" required disabled>
                        <option value="Dog">Dog</option>
                        <option value="Cat">Cat</option>
                        <option value="Rabbit">Rabbit</option>
                        <option value="Hamster">Hamster</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="editPetBio">Pet Biography/Notes</label>
                    <textarea id="editPetBio" style="height: 80px; resize: none;" disabled></textarea>
                </div>

                <div class="btn-group">
                    <button type="button" id="petToggleBtn" class="btn btn-edit">Edit Pet Information</button>
                    <button type="button" id="petCancelBtn" class="btn btn-cancel hidden">Cancel</button>
                </div>
                <div id="statusMessage" class="status-msg">Pet record synced directly to disk storage!</div>
            </form>
        </section>
    </main>
    <script src="classes/UserProfile.js"></script>
    <script src="classes/User.js"></script>
    <script src="classes/PetOwner.js"></script>
    <script src="classes/Veterinarian.js"></script>
    <script src="classes/Admin.js"></script>
    <script src="classes/Pet.js"></script>
    <script src="utils/StorageHelper.js"></script>
    <script src="utils/SessionHelper.js"></script>
    <script src="utils/Confirmation.js"></script>
    <script src="components/Navbar.js"></script>

    <script src="petProfile.js"></script>
</body>
</html>
