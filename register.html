<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PetAid</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar">
        <a href="firstAid.html" class="navbar-brand">
            <svg viewBox="0 0 24 24" fill="currentColor" style="width:24px; height:24px; vertical-align:middle; margin-right:5px;">
                <path d="M4.5 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5zm15 0a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5zm-12.5 3a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5zm10 0a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5zM12 21c-3.5 0-6-2.5-6-6 0-3 2.5-5.5 6-5.5s6 2.5 6 5.5c0 3.5-2.5 6-6 6z"/>
            </svg>
            PetAid
        </a>
        <div>
            <a href="login.html" style="text-decoration: none; color: #3498db; font-weight: bold;">Login</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="auth-card">
            <h1>Create Account</h1>
            <p style="color: #7f8c8d; margin-bottom: 30px;">Join the PetAid community.</p>
            
            <div id="statusMessage" class="status-msg"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" required>
                </div>
                
                <div class="form-group">
                    <label for="role">Account Type</label>
                    <select id="role" required>
                        <option value="petowner">Pet Owner</option>
                        <option value="veterinarian">Veterinarian</option>
                    </select>
                </div>

                <div id="certGroup" class="form-group hidden">
                    <div style="margin-bottom: 15px;">
                        <label for="phone">Contact Number</label>
                        <input 
                            type="tel" 
                            id="phone" 
                            class="form-control" 
                            placeholder="e.g. +60123456789"
                            pattern="^[+\d\s\-]+$" 
                            oninvalid="this.setCustomValidity('Please enter a valid phone number')"
                            oninput="this.setCustomValidity('')"
                        >
                    </div>

                    <div>
                        <label for="certificate">Veterinary Council Certificate (.pdf, .png, .jpg)</label>
                        <input type="file" id="certificate" class="form-control" accept=".pdf, .png, .jpg, .jpeg">
                    </div>
                </div>



                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>

                <button type="submit" 
                        style="display: block; width: max-content; padding: 12px 24px; background-color: #3498db; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;"
                        onmouseover="this.style.backgroundColor='#2980b9'" 
                        onmouseout="this.style.backgroundColor='#3498db'">
                    Register
                </button>
            </form>

            <p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="classes/UserProfile.js"></script>
    <script src="classes/User.js"></script>
    <script src="classes/PetOwner.js"></script>
    <script src="classes/Veterinarian.js"></script>
    <script src="classes/Admin.js"></script>

    <script src="utils/StorageHelper.js"></script>
    <script src="utils/SessionHelper.js"></script>
    <script src="utils/Confirmation.js"></script>
    <script src="components/footer.js"></script>
    <script src="register.js"></script>
</body>
</html>
