<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - PetAid</title>
    <link rel="stylesheet" href="css/styles.css">
    
</head>
<body>

    <nav class="navbar">
        <a href="firstAid.html" class="navbar-brand">🐾 PetAid</a>
        <ul class="navbar-links">
            <li><a href="#">Clinics</a></li>
            <li><a href="firstAid.html">First Aid</a></li>
            <li><a href="#">Forum</a></li>
            <li><a href="#">Quizzes</a></li>
        </ul>
        <div class="navbar-auth"></div>
    </nav>

    <main class="profile-container">
        <aside class="profile-card">
            <input type="file" id="ownerImgUploader" accept="image/*" style="display: none;">
            <img id="displayAvatar" src="" alt="Profile Picture" class="profile-avatar">
            <div>
                <button type="button" id="changeOwnerPhotoBtn" class="btn-photo">Change Photo</button>
            </div>
            <h1 id="displayName" class="profile-name">Loading...</h1>
            <span id="displayRole" class="profile-role">...</span>
            <div style="text-align: left; margin-top: 20px; font-size: 14px; color: #7f8c8d;">
                <strong>Username:</strong> <span id="displayUsername">...</span>
            </div>
            <div id="ownerPhotoStatusMsg" class="status-msg success" style="margin-top: 10px;">Photo Updated!</div>
        </aside>

        <section class="details-panel">
            <div class="panel-block hidden" id="vetCertPanel">
                <h2>Professional Credentials</h2>
                <div class="form-group">
                    <a id="displayVetCert" href="#" target="_blank" class="cert-badge">View Certificate Document 📄</a>
                </div>
            </div>

            <div class="panel-block">
                <h2>About Me</h2>
                <form id="bioForm">
                    <div class="form-group">
                        <label for="biographyInput">Personal Biography</label>
                        <textarea id="biographyInput" placeholder="Tell us about yourself..." disabled></textarea>
                    </div>
                    <div class="btn-group">
                        <button type="button" id="bioToggleBtn" class="btn btn-edit">Edit Biography</button>
                        <button type="button" id="bioCancelBtn" class="btn btn-cancel hidden">Cancel</button>
                    </div>
                    <div id="statusMessage" class="status-msg success">Biography synchronized!</div>
                </form>
            </div>
            <div class="panel-block hidden" id="vetPhonePanel">
                <h2>Contact Information</h2>
                <form id="phoneForm">
                    <div class="form-group">
                        <label for="phoneInput">Professional Contact Number</label>
                        <input 
                            type="tel" 
                            id="phoneInput" 
                            placeholder="e.g. +60123456789" 
                            pattern="^[+\d\s\-]+$"
                            required
                            disabled
                            oninvalid="this.setCustomValidity('Please enter a valid phone number')"
                            oninput="this.setCustomValidity('')"
                        >
                    </div>
                    <div class="btn-group">
                        <button type="button" id="phoneToggleBtn" class="btn btn-edit">Edit Phone</button>
                        <button type="button" id="phoneCancelBtn" class="btn btn-cancel hidden">Cancel</button>
                    </div>
                </form>
            </div>

            <div class="panel-block hidden" id="addPetPanel">
                <h2>🐾 Add New Pet</h2>
                <form id="petForm">
                    <div class="form-group">
                        <label for="petName">Pet Name</label>
                        <input type="text" id="petName" required placeholder="e.g. Luna" disabled>
                    </div>
                    <div class="form-group">
                        <label for="petCategory">Category</label>
                        <select id="petCategory" required disabled>
                            <option value="Dog">Dog</option>
                            <option value="Cat">Cat</option>
                            <option value="Rabbit">Rabbit</option>
                            <option value="Hamster">Hamster</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="petBio">Pet Bio</label>
                        <input type="text" id="petBio" placeholder="e.g. A very playful calico cat." disabled>
                    </div>
                    <div class="form-group">
                        <label for="petImgFile">Pet Profile Picture</label>
                        <input type="file" id="petImgFile" accept="image/*" disabled>
                    </div>
                    <div class="btn-group">
                        <button type="button" id="petToggleBtn" class="btn btn-edit">Add New Pet</button>
                        <button type="button" id="petCancelBtn" class="btn btn-cancel hidden">Cancel</button>
                    </div>
                    <div id="petStatusMessage" class="status-msg success">Pet details recorded to disk!</div>
                </form>
            </div>

            <div class="panel-block hidden" id="petsPanel">
                <h2>My Registered Pets</h2>
                <div class="pet-grid" id="petGridContainer"></div>
            </div>
        </section>
    </main>

    <script src="classes/UserProfile.js"></script>
    <script src="classes/User.js"></script>
    <script src="classes/PetOwner.js"></script>
    <script src="classes/Veterinarian.js"></script>
    <script src="classes/Admin.js"></script>

    <script src="utils/StorageHelper.js"></script>
    <script src="utils/SessionHelper.js"></script>
    <script src="utils/Confirmation.js"></script>
    <script src="profile.js"></script>
</body>
</html>
