<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Clinics Map - PetAid</title>
	<link rel="stylesheet" href="css/styles.css">
	<link rel="stylesheet" href="css/leaflet.css">
	<style>
		/* Small layout tweaks for the map page */
		#map{height:70vh; border:1px solid var(--border-card); border-radius:8px}
		.controls{display:flex;align-items:center;gap:12px;padding:8px 0;margin-bottom:12px}
		.controls .form-group select{min-width:260px;max-width:440px}
		.page-subtitle{margin-bottom:12px}

		/* Clinic modal override: make it a right-side panel (so map remains clickable).
		   On small screens it becomes a centered modal with backdrop. */
		#clinicModalOverlay {
			position:fixed;
			top:0; right:0; bottom:0; left:auto;
			width:420px; height:100%;
			background:transparent;
			display:none;
			z-index:1600;
		}
		#clinicModalOverlay.active { display:flex; align-items:flex-start; justify-content:flex-end; padding:20px; }
		#clinicModalOverlay .modal { width:380px; max-width:100%; max-height: calc(100vh - 40px); overflow:auto; border-radius:10px; box-shadow: var(--shadow-lg); }
		@media (max-width: 640px) {
			/* On phones the overlay becomes full-screen with backdrop */
			#clinicModalOverlay { left:0; width:100%; background-color: rgba(0,0,0,0.4); }
			#clinicModalOverlay.active { justify-content:center; padding:12px; align-items:center; }
			#clinicModalOverlay .modal { width:100%; max-width:440px; }
		}
	</style>
</head>
<body>
	<!-- Navbar -->
    <div id="navbar-container"></div>

	<main class="main-content">
		<h1 class="page-title">Clinics Map</h1>
		<p class="page-subtitle">Select Association Office closes to you</p>

		<div class="controls">
			<div class="form-group" style="margin:0">
				<label for="presetSelect">Select a clinic:</label>
				<select id="presetSelect"><option value="">-- Select clinic --</option></select>
			</div>
			<button id="yourLocationBtn" style="margin-top: 26px;" class="btn btn-outline btn-sm">Your Location</button>
			<button id="showNearbyVetsBtn" style="margin-top: 26px;" class="btn btn-outline btn-sm">Show Nearby Vets</button>
			<button id="showAddForm" style="margin-left: 0px; margin-top: 26px;" class="btn btn-primary btn-lg">Add Clinic</button>
		</div>

		<div id="map"></div>
	</main>

	<!-- Footer -->
    <div id="footer-container"></div>

	<!-- Clinic add modal (styled with site classes) -->
	<div id="clinicModalOverlay" class="modal-overlay" aria-hidden="true">
		<div class="modal" role="dialog" aria-modal="true" aria-labelledby="clinicModalTitle">
			<div class="modal-title" id="clinicModalTitle">Add Clinic</div>
			<div class="modal-body">
				<div class="form-group"><label for="c_name">Clinic name</label><input id="c_name" placeholder="Clinic name"></div>
				<div class="form-group"><label for="c_address">Address</label><input id="c_address" placeholder="Address"></div>
				<div class="form-group"><label for="c_phone">Phone</label><input id="c_phone" placeholder="Phone"></div>
				<div class="form-group"><label for="c_hours">Opening hours</label><input id="c_hours" placeholder="Opening hours"></div>
				<div class="form-group" style="display:flex;gap:8px">
					<div style="flex:1"><label for="c_lat">Latitude</label><input id="c_lat" placeholder="Latitude"></div>
					<div style="flex:1"><label for="c_lng">Longitude</label><input id="c_lng" placeholder="Longitude"></div>
				</div>
			</div>
			<div class="modal-actions">
				<button id="pickLocationBtn" class="btn btn-outline btn-sm">Pick on map</button>
				<button id="saveClinicBtn" class="btn btn-primary btn-sm">Save</button>
				<button id="cancelClinicBtn" class="btn btn-outline btn-sm">Cancel</button>
			</div>
		</div>
	</div>
	<script src="classes/UserProfile.js"></script>
    <script src="classes/User.js"></script>
    <script src="classes/PetOwner.js"></script>
    <script src="classes/Veterinarian.js"></script>
    <script src="classes/Admin.js"></script>
    <script src="classes/QuizQuestion.js"></script>
    <script src="classes/Quiz.js"></script>
    <script src="utils/StorageHelper.js"></script>
    <script src="utils/SessionHelper.js"></script>
    <script src="utils/Confirmation.js"></script>
	<script src="utils/leaflet.js"></script>
	<script src="components/navbar.js"></script>
	<script src="components/footer.js"></script>
	<script type="module" src="map-page.js"></script>
</body>
</html>
