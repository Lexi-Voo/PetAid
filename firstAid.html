<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Aid Guide - PetAid</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="main-content">
        <h1 class="page-title">First Aid Guide</h1>
        <p class="page-subtitle">Choose any category to start your first aid session</p>

        <!-- Category Cards -->
        <div class="category-grid">
            <div class="category-card" data-category="dog" onclick="selectCategory('dog')">
                <img src="assets/images/dog.svg" alt="Dog">
                <span class="category-card-label">Dog</span>
            </div>
            <div class="category-card" data-category="cat" onclick="selectCategory('cat')">
                <img src="assets/images/cat.svg" alt="Cat">
                <span class="category-card-label">Cat</span>
            </div>
            <div class="category-card" data-category="rabbit" onclick="selectCategory('rabbit')">
                <img src="assets/images/rabbit.svg" alt="Rabbit">
                <span class="category-card-label">Rabbit</span>
            </div>
            <div class="category-card" data-category="hamster" onclick="selectCategory('hamster')">
                <img src="assets/images/hamster.svg" alt="Hamster">
                <span class="category-card-label">Hamster</span>
            </div>
        </div>

        <!-- Guide List (appears below cards when category is selected) -->
        <section class="guide-list-section" id="guideListSection">
            <div class="guide-list-header">
                <h2 class="guide-list-title" id="guideListTitle"></h2>
                <button class="btn btn-primary btn-sm admin-only" onclick="openCreateGuideModal()">
                    + Create Guide
                </button>
            </div>
            <div class="guide-list" id="guideList">
                <!-- Guide items rendered by JS -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Create Guide Modal -->
    <div class="modal-overlay" id="guideModal">
        <div class="modal">
            <h3 class="modal-title" id="guideModalTitle">Create New Guide</h3>
            <div class="form-group">
                <label for="guideTitle">Guide Title</label>
                <input type="text" id="guideTitle" placeholder="e.g. Choking">
            </div>
            <div class="form-group">
                <label for="guideCategory">Category</label>
                <select id="guideCategory">
                    <option value="dog">Dog</option>
                    <option value="cat">Cat</option>
                    <option value="rabbit">Rabbit</option>
                    <option value="hamster">Hamster</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeGuideModal()">Cancel</button>
                <button class="btn btn-primary" id="guideModalSave" onclick="saveGuide()">Create</button>
            </div>
        </div>
    </div>

    

    <!-- Scripts (order matters) -->
    
    <script src="classes/Step.js"></script>
    <script src="classes/Video.js"></script>
    <script src="classes/FirstAidGuide.js"></script>
    <script src="components/Navbar.js"></script>
    <script src="components/Footer.js"></script>
    <script src="classes/User.js"></script>
    <script src="classes/Admin.js"></script>
    <script src="utils/StorageHelper.js"></script>
    <script src="utils/Confirmation.js"></script>
    <script src="firstAid.js"></script>

</body>
</html>
