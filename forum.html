<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forum</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <main class="main-content forum-page">
        <div class="forum-container">
            <!-- Sidebar -->
            <aside class="forum-sidebar">
                <h3>Categories</h3>
                <ul id="forum-categories">
                    <li data-category="all" class="active">All</li>
                    <li data-category="all-pet">All Pets</li>
                    <li data-category="dog">Dog</li>
                    <li data-category="cat">Cat</li>
                    <li data-category="rabbit">Rabbit</li>
                    <li data-category="hamster">Hamster</li>
                </ul>
            </aside>

            <!-- Posts Area -->
            <section class="forum-posts">
                <div class="forum-header">
                    <div>
                        <h1 class="page-title">Forum</h1>

                        <p class="page-subtitle">
                            Connect, ask and share with pet owners and professional vets
                        </p>
                    </div>

                    <button id="create-post-btn" class="btn btn-primary">
                        New Post
                    </button>
                </div>
                <div id="posts-container">
                    <!-- ForumPost cards will be rendered here -->
                </div>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Post Modal -->
    <div class="modal-overlay" id="post-modal">
        <div class="modal">
            <h3 id="modal-title">Create Forum Post</h3>
            <div class="form-group">
                <label for="post-category">Category</label>
                <select id="post-category">
                    <option value="all-pet">All Pets</option>
                    <option value="dog">Dog</option>
                    <option value="cat">Cat</option>
                    <option value="rabbit">Rabbit</option>
                    <option value="hamster">Hamster</option>
                </select>
            </div>
            <div class="form-group">
                <label for="post-title">Title</label>
                <input type="text" id="post-title">
            </div>
            <div class="form-group">
                <label for="post-content">Content</label>
                <textarea id="post-content"></textarea>
            </div>
            <div class="modal-actions">
                <button id="cancel-post" class="btn btn-primary">Cancel</button>
                <button id="submit-post" class="btn btn-primary">Post</button>
            </div>
        </div>
    </div>

    <!-- Post Detail Modal -->
    <div class="modal-overlay" id="post-detail-modal">

        <div class="modal forum-detail-modal">

            <div class="forum-detail-header">
                <h2 id="detail-post-title"></h2>

                <button
                    class="btn-icon"
                    id="close-detail-modal"
                >
                    ✕
                </button>
            </div>

            <div class="forum-detail-meta">
                <span id="detail-post-user"></span>
                •
                <span id="detail-post-date"></span>
            </div>

            <div
                id="detail-post-content"
                class="forum-detail-content"
            ></div>

            <hr class="forum-divider">

            <div class="forum-comments-section">

                <h3 class="forum-comments-title">
                    Comments
                </h3>

                <div id="comments-container">

                </div>

                <div class="forum-comment-form">

                    <textarea
                        id="comment-input"
                        placeholder="Write a comment..."
                    ></textarea>

                    <button
                        id="submit-comment-btn"
                        class="btn btn-primary"
                    >
                        Add Comment
                    </button>

                </div>
            </div>
        </div>
    </div>

    <script src="classes/UserProfile.js"></script>
    <script src="classes/User.js"></script>
    <script src="classes/PetOwner.js"></script>
    <script src="classes/Veterinarian.js"></script>
    <script src="classes/Admin.js"></script>

    <script src="classes/Comment.js"></script>
    <script src="classes/ForumPost.js"></script>
    <script src="classes/Forum.js"></script>

    <script src="utils/StorageHelper.js"></script>
    <script src="utils/SessionHelper.js"></script>
    <script src="utils/Confirmation.js"></script>

    <script src="components/footer.js"></script>
    <script src="components/navbar.js"></script>
    <script src="forum.js"></script>
</body>
</html>
